# Release configuration. A tag push (vX.Y.Z) runs this through
# .github/workflows/release.yml. Test locally with:
#   goreleaser release --snapshot --clean
version: 2
project_name: realmlint

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: realmlint
    main: ./cmd/realmlint
    binary: realmlint
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  # The agent for hosted realmlint, for the same platforms.
  - id: realmlint-agent
    main: ./cmd/realmlint-agent
    binary: realmlint-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: realmlint
    ids: [realmlint]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/checks.md
  - id: realmlint-agent
    ids: [realmlint-agent]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "realmlint-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, made by syft and published with the release.
sboms:
  - artifacts: archive

dockers_v2:
  - id: realmlint
    ids: [realmlint]
    dockerfile: Dockerfile
    images:
      - ghcr.io/realmlint/realmlint
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: realmlint
      org.opencontainers.image.description: Lint and diff Keycloak realm configuration
      org.opencontainers.image.source: https://github.com/realmlint/realmlint
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
  - id: realmlint-agent
    ids: [realmlint-agent]
    dockerfile: Dockerfile.agent
    images:
      - ghcr.io/realmlint/realmlint-agent
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: realmlint-agent
      org.opencontainers.image.description: Agent for hosted realmlint; reads Keycloak through view-only roles and sends snapshots with secrets removed
      org.opencontainers.image.source: https://github.com/realmlint/realmlint
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: realmlint
    name: realmlint
