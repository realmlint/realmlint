name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          args: --build-tags integration

  # The agent against real Keycloak containers (26.6, 26.7 and 26.8).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags integration -timeout 20m ./pkg/keycloak

  # Runs the action from this checkout against a fixture, using a binary
  # built from source instead of a release.
  action:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build realmlint
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/bin/" ./cmd/realmlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Passes when nothing reaches fail-on
        uses: ./
        with:
          paths: testdata/realms/26.8.0/single.json
          fail-on: critical
          sarif: "false"
          install: "false"

      - name: Fails on findings
        id: failing
        continue-on-error: true
        uses: ./
        with:
          paths: testdata/realms/26.8.0/s*.json
          sarif: "false"
          install: "false"

      - name: Upgrade advice without impact passes
        id: upgrade-clear
        uses: ./
        with:
          paths: testdata/realms/26.6.4/single.json
          fail-on: none
          sarif: "false"
          install: "false"
          upgrade-to: 26.7.0
          fail-on-upgrade: "true"

      - name: Fails on upgrade impact when asked to
        id: upgrade-affected
        continue-on-error: true
        uses: ./
        with:
          paths: testdata/realms/26.6.4/single.json
          fail-on: none
          sarif: "false"
          install: "false"
          upgrade-to: latest
          fail-on-upgrade: "true"

      - name: Check results
        shell: bash
        run: |
          [[ "${{ steps.failing.outcome }}" == "failure" ]] || { echo "expected the action to fail"; exit 1; }
          [[ "${{ steps.failing.outputs.exit-code }}" == "1" ]] || { echo "expected exit-code 1"; exit 1; }
          [[ "${{ steps.upgrade-clear.outputs.upgrade-exit-code }}" == "0" ]] || { echo "expected upgrade-exit-code 0 up to 26.7.0"; exit 1; }
          [[ "${{ steps.upgrade-affected.outcome }}" == "failure" ]] || { echo "expected the upgrade to latest to fail"; exit 1; }
          [[ "${{ steps.upgrade-affected.outputs.upgrade-exit-code }}" == "1" ]] || { echo "expected upgrade-exit-code 1"; exit 1; }

  # Runs the terraform-state action from this checkout against a stub of the
  # portal endpoint.
  terraform-state-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stub portal
        run: |
          python3 scripts/stub-portal.py 8765 &
          for _ in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.5; done

      - name: Sends the state
        id: sent
        uses: ./terraform-state
        with:
          url: http://127.0.0.1:8765/
          token: test-token
          state-file: testdata/terraform/state.json
          fail-on-error: "true"

      - name: Fails on a wrong token when asked to
        id: refused
        continue-on-error: true
        uses: ./terraform-state
        with:
          url: http://127.0.0.1:8765
          token: wrong
          state-file: testdata/terraform/state.json
          fail-on-error: "true"

      - name: Only warns by default
        uses: ./terraform-state
        with:
          url: http://127.0.0.1:8765
          token: wrong
          state-file: testdata/terraform/state.json

      - name: Check results
        run: |
          [[ "${{ steps.sent.outputs.resources }}" == "1" ]] || { echo "expected 1 resource"; exit 1; }
          [[ "${{ steps.sent.outputs.realms }}" == "acme" ]] || { echo "expected realm acme"; exit 1; }
          [[ "${{ steps.refused.outcome }}" == "failure" ]] || { echo "expected the wrong token to fail"; exit 1; }

      - name: GitLab template runs in an Alpine image
        run: sh scripts/test-gitlab-template.sh
