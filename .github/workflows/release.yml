name: Release

on:
  push:
    # Full versions only: the moving major tag (v1) used by the GitHub Action
    # must not start a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  # Signing build provenance with the workflow's GitHub identity.
  id-token: write
  attestations: write

jobs:
  release:
    # Releases are published from the public repository only.
    if: github.repository == 'realmlint/realmlint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: anchore/sbom-action/download-syft@v0.24.3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance attestations let users check that a file or image was
      # built by this workflow from this repository:
      #   gh attestation verify <file> --repo realmlint/realmlint
      - name: Attest release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt

      - name: Find the image digest
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "ghcr.io/realmlint/realmlint:${GITHUB_REF_NAME#v}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]] || { echo "could not read the image digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the container image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/realmlint/realmlint
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
